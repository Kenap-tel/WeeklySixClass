<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Over and Mouse Out</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <p class="instructions">
        Move your mouse over the input box to display the heading.
        Move your mouse away to hide the heading.
    </p>

    <input type="text" id="myInput" placeholder="Move your mouse here">

    <h1 id="myHeading">Welcome to Dynamic Documents!</h1>

</body>
</html>
